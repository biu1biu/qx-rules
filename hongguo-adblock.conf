# 红果短剧 去广告 QX 重写规则 v2.1（配套 hongguo-adblock.list）
# 用途：QX -> 资源 -> 重写(Rewrite) 远程资源，粘贴本文件 raw 链接
# 作用：
#   1) 按路径拦截广告运行时资源包(gecko: nextad_runtime_series)，不影响其它 gecko 资源
#   2) [mitm] 铺宽捕获面：让下一次抓包能解密“广告策略/解锁倒计时”接口与 nextad JS 主包
#      —— 用于定位“等7秒才能看下一集”那个倒计时是服务器下发还是本地 JS 常量
#
# 注意：7 秒倒计时是 nextad 广告框架的“无广告兜底计时”，跑在本地缓存 JS 里；
#       需抓到广告策略响应(含秒数字段)或 nextad 的 .js 主包，才能精确 patch。

[rewrite_local]
# 广告运行时资源包（字节 gecko: nextad_runtime，含镜像域）
^https?:\/\/[\w.-]+\.bytegecko\.com\/.+\/gecko\/resource\/nextad_runtime.+ url reject
^https?:\/\/[\w.-]+\.byted\.org\/.+\/gecko\/resource\/nextad_runtime.+ url reject
^https?:\/\/[\w.-]+\.byteimg\.com\/.+\/nextad_runtime.+ url reject

[mitm]
hostname = *.bytegecko.com, *.byted.org, gecko.zijieapi.com, media-show.wanzi.com, *.snssdk.com
