# 红果短剧 去广告 QX 重写规则 v2（配套 hongguo-adblock.list 使用）
# 用途：QX -> 资源 -> 重写(Rewrite) 远程资源，粘贴本文件 raw 链接
# 作用：按路径拦截红果的广告运行时资源包(gecko: nextad_runtime_series)，
#       只打这一个包，不影响 gecko 下发的其它资源(Lynx 卡片/收银台等)。
# 注意：本次 HAR 里对 gecko/wanzi 的响应体是空的(status 0)，因为它们没被 MITM 解密；
#       下面把它们加进 mitm hostname，是为了让下一次抓包能看到广告填充/配置接口。

[rewrite_local]
# 广告运行时资源包（字节 gecko: nextad_runtime）
^https?:\/\/[\w.-]+\.bytegecko\.com\/.+\/gecko\/resource\/nextad_runtime.+ url reject
^https?:\/\/[\w.-]+\.byteimg\.com\/.+\/nextad_runtime.+ url reject

[mitm]
hostname = *.bytegecko.com, gecko.zijieapi.com, media-show.wanzi.com
